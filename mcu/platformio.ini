; PlatformIO project configuration for ESP32-WROOM-32UE DevKitC V4
; https://docs.platformio.org/en/latest/boards/espressif32/esp32dev.html

[env:esp32_wroom]
platform  = espressif32
board     = esp32dev
framework = arduino

lib_deps =
    beegee-tokyo/DHTesp          ; DHT11 — ESP32-optimized, interrupt-safe
    knolleary/PubSubClient       ; MQTT publish (synchronous, QoS 0)
    bblanchon/ArduinoJson @ ^7   ; JSON serialization (v7 API — use JsonDocument, not StaticJsonDocument)

; MQTT_MAX_PACKET_SIZE: defensive 512-byte override. The target 3-field payload
; (~81 bytes) fits within the default 256-byte limit, but 512 provides headroom
; for future field additions without revisiting this setting.
build_flags =
    -DMQTT_MAX_PACKET_SIZE=512

monitor_speed = 115200
